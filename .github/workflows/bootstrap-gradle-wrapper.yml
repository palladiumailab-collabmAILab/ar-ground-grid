name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [feat/ar-ground-grid-android-mvp]
    paths: [.github/workflows/bootstrap-gradle-wrapper.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ar-ground-grid-android-mvp
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Generate and verify wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.5.0 --distribution-type bin
          python - <<'PY'
          from pathlib import Path
          p = Path('gradle/wrapper/gradle-wrapper.properties')
          s = p.read_text()
          marker = 'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.0-bin.zip\n'
          checksum = 'distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746\n'
          if checksum not in s:
              s = s.replace(marker, marker + checksum)
          p.write_text(s)
          PY
          echo '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          chmod +x gradlew
          rm .github/workflows/bootstrap-gradle-wrapper.yml
      - name: Commit wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties .github/workflows/bootstrap-gradle-wrapper.yml
          git commit -m 'build: add verified Gradle Wrapper 9.5.0'
          git push origin HEAD:feat/ar-ground-grid-android-mvp
