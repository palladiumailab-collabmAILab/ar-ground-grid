name: Verify Docker Once

on:
  push:
    branches: [feat/ar-ground-grid-android-mvp]
    paths: [.github/workflows/verify-docker-once.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ar-ground-grid-android-mvp
      - name: Build image
        run: docker build -t ar-ground-grid-ci .
      - name: Run repository quality gate in Docker
        run: docker run --rm -v "$PWD:/workspace" -w /workspace ar-ground-grid-ci
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/verify-docker-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-docker-once.yml
          git commit -m 'chore: remove one-shot Docker verification workflow'
          git push origin HEAD:feat/ar-ground-grid-android-mvp
